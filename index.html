<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0c1a14" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <title>PK決戦 - PK Shootout</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=107" />
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister();
          }
        });
      }
      if ("caches" in window) {
        caches.keys().then(function (names) {
          for (var i = 0; i < names.length; i++) {
            caches.delete(names[i]);
          }
        });
      }
    </script>
  </head>
  <body>
    <div id="app">
      <header class="hud" id="hud" hidden>
        <div class="scoreboard">
          <div class="side you">
            <div class="country-head">
              <span class="country-head-spacer" aria-hidden="true">VS</span>
              <span class="label" id="label-you">JAPAN</span>
            </div>
            <div class="score-row">
              <span class="flag" id="flag-you" aria-hidden="true">🇯🇵</span>
              <span class="score" id="score-you">0</span>
            </div>
            <div class="kicks" id="kicks-you"></div>
          </div>
          <div class="round-meta">
            <span class="brand-mini">PK決戦</span>
            <span class="round" id="round-label">1 / 5</span>
          </div>
          <div class="side cpu">
            <div class="country-head">
              <span class="vs-prefix">VS</span>
              <span class="label" id="label-cpu">RIVAL</span>
            </div>
            <div class="score-row">
              <span class="score" id="score-cpu">0</span>
              <span class="flag" id="flag-cpu" aria-hidden="true">🏳️</span>
            </div>
            <div class="kicks" id="kicks-cpu"></div>
          </div>
        </div>
        <p class="prompt" id="prompt"></p>
      </header>

      <canvas id="pitch" aria-hidden="true"></canvas>

      <section class="screen title-screen" id="title-screen">
        <div class="title-atmosphere" aria-hidden="true"></div>
        <div class="title-content">
          <p class="eyebrow">SUDDEN DEATH</p>
          <h1 class="brand">PK決戦</h1>
          <p class="tagline">もつれた試合を、一発で決める。</p>
          <div class="cta-row">
            <button type="button" class="btn primary" id="btn-start">キックオフ</button>
          </div>
          <p class="hint">キックオフのあと、ピッチをクリックするとホイッスルが鳴り助走が始まります。</p>
          <p class="hint boot-error" id="boot-error" hidden>ゲーム脚本の読み込みに失敗しました。</p>
        </div>
      </section>

      <section class="screen result-screen" id="result-screen" hidden>
        <div class="result-card">
          <p class="result-kicker" id="result-kicker">MATCH OVER</p>
          <h2 class="result-title" id="result-title">歓喜</h2>
          <p class="result-score" id="result-score">0 - 0</p>
          <button type="button" class="btn primary" id="btn-retry">もう一度</button>
        </div>
      </section>

      <section class="screen access-blocked-screen" id="access-blocked-screen" hidden>
        <div class="blocked-card">
          <div class="lock-icon">🔒</div>
          <h2 id="blocked-title">アクセス制限</h2>
          <p class="blocked-desc" id="blocked-desc">正規の購入ガイド（PDF）からアクセスしてください。</p>
          <p class="blocked-sub" id="blocked-sub">本ゲームはBooth購入者専用コンテンツです。<br>購入時にダウンロードしたPDFガイド内の「ゲームを起動する」ボタンをタップしてアクセスしてください。</p>
        </div>
      </section>

      <button type="button" class="btn-settings" id="btn-settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>

      <div class="modal-overlay" id="settings-modal" hidden>
        <div class="modal-card">
          <div class="modal-header">
            <h2 class="modal-title" id="modal-title-settings">設定 / Settings</h2>
            <button type="button" class="modal-close" id="btn-close-settings" aria-label="Close">&times;</button>
          </div>
          <div class="modal-body">
            <label class="setting-label" id="setting-label-lang">言語 / Language</label>
            <div class="lang-grid">
              <button type="button" class="lang-btn" data-lang="ja">🇯🇵 日本語</button>
              <button type="button" class="lang-btn" data-lang="en">🇺🇸 English</button>
              <button type="button" class="lang-btn" data-lang="es">🇪🇸 Español</button>
              <button type="button" class="lang-btn" data-lang="zh">🇨🇳 中文</button>
              <button type="button" class="lang-btn" data-lang="ko">🇰🇷 한국어</button>
              <button type="button" class="lang-btn" data-lang="fr">🇫🇷 Français</button>
            </div>
            <label class="setting-label setting-label-team" id="setting-label-team">マイチーム / My Team</label>
            <div class="team-grid" id="team-grid"></div>
          </div>
        </div>
      </div>

      <div class="controls" id="controls" hidden>
        <div class="aim-hint" id="aim-hint">クリックで助走開始</div>
      </div>
    </div>
    <script>
      window.addEventListener("error", function (e) {
        var el = document.getElementById("boot-error");
        if (el) {
          el.hidden = false;
          el.style.display = "block";
          el.textContent = "エラー: " + (e.message || e.error || e);
        }
      });
      window.addEventListener("unhandledrejection", function (e) {
        var el = document.getElementById("boot-error");
        if (el) {
          el.hidden = false;
          el.style.display = "block";
          el.textContent = "エラー: " + (e.reason || e);
        }
      });
    </script>
    <script type="module" src="./game.js?v=107"></script>
    <script>
      setTimeout(function () {
        if (window.__PK_LOADED) {
          var el = document.getElementById("boot-error");
          if (el) el.hidden = true;
          return;
        }
        var el = document.getElementById("boot-error");
        if (!el || !el.hidden) return;
        el.hidden = false;
        el.textContent =
          location.protocol === "file:"
            ? "このままでは動きません。ターミナルで npm start し、 http://127.0.0.1:5180/ を開いてください。"
            : "ゲーム脚本の読み込みに失敗しました。ページをハードリロードするか、 npm start で再起動してください。";
      }, 12000);
    </script>
  </body>
</html>
